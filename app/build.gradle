plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.slickstax841.padmap'
    compileSdk 34

    defaultConfig {
        applicationId "com.slickstax841.padmap"
        minSdk 26
        targetSdk 34
        versionCode 76
        versionName "76.0"
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions { kotlinCompilerExtensionVersion '1.5.13' }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.05.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

def sidecarSrc = file("${rootDir}/sidecar/src")
def sidecarClasses = file("${buildDir}/sidecar/classes")
def sidecarJar = file("${projectDir}/src/main/assets/sidecar/padmap-sidecar.jar")
def androidJar = file("${android.sdkDirectory}/platforms/android-${android.compileSdk}/android.jar")
def d8 = file("${android.sdkDirectory}/build-tools/35.0.0/d8")

tasks.register('compileSidecar', JavaCompile) {
    source = fileTree(sidecarSrc)
    include '**/*.java'
    classpath = files(androidJar)
    destinationDirectory = sidecarClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.bootstrapClasspath = files(androidJar)
}

tasks.register('packageSidecar') {
    dependsOn compileSidecar
    inputs.dir(sidecarClasses)
    outputs.file(sidecarJar)
    doLast {
        sidecarJar.parentFile.mkdirs()
        def classes = fileTree(sidecarClasses).include('**/*.class').files
        if (classes.isEmpty()) throw new GradleException("sidecar compile produced no classes")
        exec {
            commandLine([d8.absolutePath, '--min-api', '26', '--output', sidecarJar.absolutePath] + classes.collect { it.absolutePath })
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'packageSidecar' }
}
